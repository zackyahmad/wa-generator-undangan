<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Undangan WA Yuka & Zacky</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background: #fdfbf7; }
        textarea { width: 100%; padding: 10px; border: 1px solid #d4af37; border-radius: 8px; }
        button.btn-generate { background: #8b263e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        button.btn-generate:hover { background: #721d31; }
        .list-container { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .card { padding: 15px; border: 1px solid #ddd; background: white; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-wa { background: #25D366; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: #8b263e;">Generator Pesan WA Undangan</h2>
    <p>Paste daftar nama tamu di bawah ini (satu baris satu nama):</p>
    
    <textarea id="namaTamu" rows="10">
    Masukan Nama tamu disini
    </textarea>
    
    <button class="btn-generate" onclick="buatLink()">Buat Tombol Share WA</button>

    <div class="list-container" id="hasilTamu"></div>

    <script>
        function buatLink() {
            const textarea = document.getElementById("namaTamu").value;
            const names = textarea.split("\n").filter(name => name.trim() !== "");
            const container = document.getElementById("hasilTamu");
            container.innerHTML = "";

            names.forEach(name => {
                const cleanName = name.trim();
                const urlName = encodeURIComponent(cleanName);
                
                // Format Pesan Undangan (Tinggal disesuaikan jika perlu)
                const textWA = `بِسْــــــــــــــمِ اللهِ الرَّحْمَنِ الرَّحِيْـــــم

✨ UNDANGAN PERNIKAHAN ✨

Kepada Yth:
*${cleanName}*

Segala puji bagi Allah SWT yang telah menciptakan makhluk-Nya berpasang-pasangan. Dengan ini kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami :

*Mayyuka Reforika* & *Zacky Ahmad Thirafi Haekal*

Insyaa Allah yang akan diselenggarakan pada:
📅 *07 November 2026*

📍 *Tempat Acara*
Museum Lampung, Jl. ZA. Pagar Alam No.64, Gedong Meneng, Kec. Rajabasa, Kota Bandar Lampung

Klik link berikut untuk Undangan Resmi:
https://zacky-yuka.my.id/?to=${urlName}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan do'a terbaiknya.

Jazaakumullah Khairan Katsiran 🤲`;

                const linkWA = `https://wa.me/?text=${encodeURIComponent(textWA)}`;

                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <span style="font-weight: 600;">${cleanName}</span>
                    <a href="${linkWA}" target="_blank" class="btn-wa">Share WA ➔</a>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
