    <button class="btn-generate" onclick="buatLink()">Buat Tombol Share WA</button>

    <div class="list-container" id="hasilTamu"></div>

    <script>
        function buatLink() {
            const textarea = document.getElementById("namaTamu").value;
            const names = textarea.split("\n").filter(name => name.trim() !== "");
            const container = document.getElementById("hasilTamu");
            container.innerHTML = "";

            names.forEach(name => {
                const cleanName = name.trim();
                const urlName = encodeURIComponent(cleanName);
                
                // Format Pesan Undangan (Tinggal disesuaikan jika perlu)
                const textWA = `بِسْــــــــــــــمِ اللهِ الرَّحْمَنِ الرَّحِيْـــــم

✨ UNDANGAN PERNIKAHAN ✨

Kepada Yth:
*${cleanName}*

Segala puji bagi Allah SWT yang telah menciptakan makhluk-Nya berpasang-pasangan. Dengan ini kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami :

*Mayyuka Reforika* & *Zacky Ahmad Thirafi Haekal*

Insyaa Allah yang akan diselenggarakan pada:
📅 *07 November 2026*

📍 *Tempat Acara*
Museum Lampung, Jl. ZA. Pagar Alam No.64, Gedong Meneng, Kec. Rajabasa, Kota Bandar Lampung

Klik link berikut untuk Undangan Resmi:
https://zacky-yuka.my.id/?to=${urlName}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan do'a terbaiknya.

Jazaakumullah Khairan Katsiran 🤲`;

                const linkWA = `https://wa.me/?text=${encodeURIComponent(textWA)}`;

                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <span style="font-weight: 600;">${cleanName}</span>
                    <a href="${linkWA}" target="_blank" class="btn-wa">Share WA ➔</a>
                `;
                container.appendChild(card);
            });
        }
    </script>
